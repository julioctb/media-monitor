x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://media:media@db:5432/mediamonitor
  X_PROVIDER_API_KEY: ${X_PROVIDER_API_KEY:-}
  X_PROVIDER_BASE_URL: ${X_PROVIDER_BASE_URL:-https://api.twitterapi.io}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  ALERT_FROM: ${ALERT_FROM:-alerts@example.com}
  INGEST_INTERVAL_MIN: ${INGEST_INTERVAL_MIN:-15}
  LAYA_POLITICAL_CONFIDENCE_THRESHOLD: ${LAYA_POLITICAL_CONFIDENCE_THRESHOLD:-0.70}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
      POSTGRES_DB: mediamonitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d mediamonitor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes:
      # Persist the HuggingFace cache: the Laya sentiment model (~300MB)
      # must survive container recreation, else every up --build re-downloads.
      - hfcache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      # Public origin of the dashboard: adapter-node defaults to https for the
      # CSRF origin check when no proxy header is present, which would 403 the
      # form actions over plain http. Keep in sync with the exposed port.
      ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  hfcache:
